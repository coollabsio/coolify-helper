name: Build

on:
  schedule:
    - cron: "50 7 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

cache-mode: none

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan build
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Plan the image version
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: scripts/plan-version.sh --build

  build:
    name: Build image (${{ matrix.platform }})
    needs: plan
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Build the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: src
          platforms: ${{ matrix.platform }}
          tags: coollabsio/coolify-helper:test
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false

      - name: Upload the image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          retention-days: 1
